name: Recall
options:
  bundleIdPrefix: com.brianwan
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"

targets:
  Recall:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Sources/Recall
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brianwan.Recall
        DEVELOPMENT_TEAM: ""
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
    info:
      path: Sources/Recall/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIAppFonts:
          - "Fraunces-Italic[SOFT,WONK,opsz,wght].ttf"
          - IBMPlexMono-Regular.ttf
          - IBMPlexMono-Italic.ttf

  RecallTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Tests/RecallTests
    dependencies:
      - target: Recall
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brianwan.RecallTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Recall.app/Recall"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  Recall:
    build:
      targets:
        Recall: all
        RecallTests: [test]
    test:
      targets:
        - RecallTests
    run:
      config: Debug
